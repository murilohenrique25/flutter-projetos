name: delivery_cliente_app
description: App cliente do sistema de delivery express
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # HTTP Client
  dio: ^5.3.2

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  carousel_slider: ^4.2.1

  # Navigation
  go_router: ^12.1.1

  # Push Notifications
  firebase_messaging: ^14.6.9
  firebase_core: ^2.17.0

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2

  # Utils
  intl: ^0.18.1
  url_launcher: ^6.1.14
  image_picker: ^1.0.4

  # WebSocket
  socket_io_client: ^2.0.3

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

