name: delivery_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

   # Localização
  geolocator: ^14.0.2
  google_maps_flutter: ^2.9.0

  # Estado e gerenciamento
  provider: ^6.1.1

  # HTTP e WebSocket
  http: ^1.1.0
  web_socket_channel: ^2.4.0

  # UI
  flutter_polyline_points: ^2.0.0

  # Utilitários
  intl: ^0.18.1

  flutter_lints: ^5.0.0

